<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A Stephen Sondheim musical tournament: 12 shows, one pick at a time, until your favourite is left. Share your champion.">
<title>Sondheim Showdown | A Stephen Sondheim musical tournament</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Golos+Text:wght@400;500&display=swap" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/kubai-icons@0.13.1/dist/cdn/element.js"></script>
<style>
/* Hallmark · shape: single-screen tournament (start field, two-up battle, champion poster) · genre: editorial · theme: Carnival (deal 1/3, seed one-page-tournament-game-where-9669·1c1b7959·2026-11-21·r0) · redesign: full
 * hero: Ledge (oxblood field, the type sits low on purpose over a halftone corner) · nav: none (one-screen game) · footer: none · imagery: none · signature: the two options as flat mustard and oxblood posters with hard ink shadows · carnival: cold-snap
 * axes: light/display-heavy/chromatic-yellow · posture: full-palette · contrast: pass · fold: pass · v2.0.0 */
/* Hallmark · dropped #n · the old paper-noise SVG filter id; the paper texture was replaced by flat Carnival fills */
/* Hallmark · pre-emit critique: P4 H4 E3 S4 R4 V4 · weakest: E, motion kept to colour swaps and the 1px press; the old lift and entrance animation were removed */
:root {
  color-scheme: light;
  --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px; --space-3xl: 96px; --space-4xl: 144px;
  --text-xs: 0.8125rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.25rem; --text-xl: 1.5625rem; --text-2xl: 1.953rem; --text-3xl: 2.441rem;
  --text-display-s: clamp(2.25rem, 4vw + 0.5rem, 3.75rem); --text-display: clamp(2.75rem, 5vw + 1rem, 5.25rem);
  --text-section: clamp(2rem, 2.5vw + 1rem, 3.5rem); --text-title: clamp(1.25rem, 0.75vw + 0.875rem, 1.625rem); --text-lead: clamp(1.125rem, 0.35vw + 1rem, 1.375rem);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-in: cubic-bezier(0.7, 0, 0.84, 0); --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-micro: 120ms; --dur-short: 220ms; --dur-long: 420ms;
  --color-error: oklch(52% 0.19 27); --color-success: oklch(50% 0.12 150);
  --container: 1440px; --gutter: 64px; --gap-columns: 32px; --section-gap-s: 120px; --section-gap: 144px; --section-gap-l: 176px;
  --z-base: 1; --z-raised: 10; --z-dropdown: 100; --z-sticky: 200; --z-sticky-nav: 300; --z-modal: 400; --z-toast: 500; --z-tooltip: 600;
  --color-paper: oklch(92% 0.045 50); --color-paper-2: oklch(88% 0.050 45); --color-paper-3: oklch(82% 0.060 40);
  --color-ink: oklch(18% 0.080 20); --color-ink-2: oklch(28% 0.060 25); --color-muted: oklch(42% 0.050 30);
  --color-rule: oklch(40% 0.21 25); --color-accent: oklch(86% 0.18 95); --color-accent-2: oklch(40% 0.21 25);
  --color-accent-ink: oklch(18% 0.080 20); --color-focus: oklch(40% 0.21 25);
  --font-display: "Big Shoulders Display", Impact, "PingFang SC", "Microsoft YaHei", sans-serif; --font-body: "Golos Text", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-outlier: var(--font-body);
  --radius-card: 2px; --radius-pill: 2px; --rule-hair: 1px; --rule-bar: 2px; --shadow-card: 4px 4px 0 var(--color-ink);
  --tracking-display: 0.015em; --display-weight: 800;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { scrollbar-color: var(--color-muted) var(--color-paper); scroll-padding-top: var(--space-3xl); }
body { margin: 0; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); font-size: var(--text-md); line-height: 1.55; -webkit-font-smoothing: antialiased; caret-color: var(--color-accent); }
::selection { background: color-mix(in oklab, var(--color-accent) 22%, transparent); color: var(--color-ink); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.16em; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: var(--display-weight, 700); font-synthesis: none; letter-spacing: var(--tracking-display); line-height: 1.05; overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
h1 { max-width: 20ch; font-size: var(--text-display); } h2 { max-width: 30ch; font-size: var(--text-section); } h3 { max-width: 40ch; font-size: var(--text-title); line-height: 1.2; }
.lead { font-size: var(--text-lead); line-height: 1.45; max-width: 52ch; }
p { margin: 0; text-wrap: pretty; }
p:not([class]) { max-width: 65ch; }
img, video { max-width: 100%; height: auto; display: block; }
svg { display: block; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; }
.container { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); box-sizing: border-box; }
.num, .figure, td.num { font-variant-numeric: tabular-nums; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[data-slot] { position: relative; overflow: hidden; background: linear-gradient(160deg, var(--color-paper-2, var(--color-paper)), var(--color-paper-3, var(--color-paper))); }
[data-slot] > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
[data-slot]:has(> img) > :not(img):not([data-keep]) { display: none !important; }
@media (max-width: 60rem) { :root { --gutter: 24px; --section-gap-s: 80px; --section-gap: 96px; --section-gap-l: 120px; } }
@media (max-width: 40rem) { :root { --gutter: 16px; --section-gap-s: 56px; --section-gap: 72px; --section-gap-l: 96px; --gap-columns: 16px; } }
@media (prefers-reduced-motion: reduce) { *:not(.keep-motion), *:not(.keep-motion)::before, *:not(.keep-motion)::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; } }
/* photographs: natural vib=20 con=10 */
[data-slot] > img { filter: saturate(1.1) contrast(1.1); }

/* ---- page ---- */
.hide{display:none!important}
.band-b{background:var(--color-accent-2);color:var(--color-paper)}
.band-b :focus-visible{outline-color:var(--color-paper)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-xs);min-height:48px;padding:var(--space-xs) var(--space-lg) var(--space-xs) var(--space-md);
 border:var(--rule-bar) solid var(--color-ink);border-radius:var(--radius-pill);box-shadow:var(--shadow-card);background:var(--color-paper);color:var(--color-ink);
 font:var(--display-weight) var(--text-lg)/1 var(--font-display);text-transform:uppercase;cursor:pointer;
 transition:background-color var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out),transform var(--dur-micro) var(--ease-out),box-shadow var(--dur-micro) var(--ease-out)}
.btn.primary{background:var(--color-accent);color:var(--color-accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:not([disabled]):active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--color-ink)}
.ico{width:20px;height:20px;flex:none;display:inline-block}
.row{display:flex;gap:var(--space-md);flex-wrap:wrap;justify-content:center;margin-block:var(--space-xl)}
.row.start{justify-content:flex-start;margin-block:var(--space-xl) 0}

/* 开始页：深红色场 + 海报大字 */
#start{position:relative;overflow:clip;min-height:100svh;display:grid;align-content:end;padding-block:var(--space-2xl)}
#start h1{max-width:none;font-size:clamp(4rem,12vw,11rem);line-height:1;text-transform:uppercase}
#start .lead{margin-top:var(--space-lg);font-size:var(--text-title)}
#start::after{content:"";position:absolute;right:0;bottom:0;width:min(44vw,420px);aspect-ratio:1;pointer-events:none;
 background-image:radial-gradient(var(--color-ink) 1.5px,transparent 1.5px);background-size:12px 12px;
 -webkit-mask-image:linear-gradient(315deg,var(--color-ink),transparent 70%);mask-image:linear-gradient(315deg,var(--color-ink),transparent 70%)}
#start .container{position:relative;z-index:var(--z-base)}

/* 比赛页 */
#battle{padding-block:var(--space-xl) var(--space-2xl)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-md);flex-wrap:wrap}
.meta h2{font-size:var(--text-section);text-transform:uppercase}
.meta p{font-variant-numeric:tabular-nums;color:var(--color-muted)}
.bar{height:16px;margin-top:var(--space-sm);border:var(--rule-bar) solid var(--color-ink);background:var(--color-paper);overflow:hidden}
.bar i{display:block;width:100%;height:100%;background:var(--color-accent-2);transform:scaleX(0);transform-origin:left;transition:transform var(--dur-long) var(--ease-out)}
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--space-lg);align-items:stretch;margin-block:var(--space-xl)}
.vs{align-self:center;font:var(--display-weight) var(--text-2xl)/1 var(--font-display);text-transform:uppercase}
.card{display:flex;flex-direction:column;min-height:320px;padding:0;text-align:left;cursor:pointer;
 border:var(--rule-bar) solid var(--color-ink);border-radius:var(--radius-card);box-shadow:var(--shadow-card);
 background:var(--color-accent);color:var(--color-accent-ink);
 transition:background-color var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out),transform var(--dur-micro) var(--ease-out),box-shadow var(--dur-micro) var(--ease-out)}
.arena>.card:last-child{background:var(--color-accent-2);color:var(--color-paper)}
.card .t{flex:1;padding:var(--space-lg);font:var(--display-weight) var(--text-display-s)/1 var(--font-display);letter-spacing:var(--tracking-display);text-transform:uppercase;overflow-wrap:break-word;min-width:0;text-wrap:balance}
.card .ic{flex:1;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 var(--space-lg) var(--space-md)}
.card .s{padding:var(--space-sm) var(--space-lg);border-top:var(--rule-bar) solid currentColor;font-size:var(--text-sm);font-weight:500}
.card:not(:disabled):active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--color-ink)}
.card:disabled{cursor:default}
.card.won{background:var(--color-ink)!important;color:var(--color-paper)!important}
.card.lost{animation:out var(--dur-short) var(--ease-out) forwards}
@keyframes out{to{opacity:0}}

/* 结果页 */
#result .band-b{padding-block:var(--space-2xl)}
.champ{display:flex;align-items:center;justify-content:space-between;gap:var(--space-xl)}
.champ-t{min-width:0}
.champ-ic{flex:none}
.champ .label{margin-top:var(--space-md);font-size:var(--text-sm);font-weight:500}
.champ h2{max-width:none;font-size:clamp(3.5rem,12vw,8.5rem);line-height:1;text-transform:uppercase}
.champ .lead{margin-top:var(--space-md)}
#result .container.body{padding-block:var(--space-xl) var(--space-2xl)}
.msg{min-height:1.6em;text-align:center;font-weight:500}
details summary{font:var(--display-weight) var(--text-section)/1 var(--font-display);text-transform:uppercase;cursor:pointer;margin-block:var(--space-lg) var(--space-md)}
.rd{margin-block:var(--space-lg)}
.rd h3{max-width:none;padding-top:var(--space-xs);border-top:var(--rule-bar) solid var(--color-accent-2);text-transform:uppercase}
.rd div{display:flex;justify-content:space-between;gap:var(--space-md);align-items:baseline;padding-block:var(--space-xs);border-bottom:var(--rule-bar) solid var(--color-accent-2)}
.rd div b{font:var(--display-weight) var(--text-title)/1.1 var(--font-display);text-transform:uppercase}
.rd div span{text-align:right;color:var(--color-ink-2)}

/* 悬停只换色，不位移；且只在支持悬停的设备上 */
@media (hover:hover){
 .btn:not([disabled]):hover{background:var(--color-paper-3);color:var(--color-ink)}
 .btn.primary:not([disabled]):hover{background:var(--color-ink);color:var(--color-paper)}
 .card:not(:disabled):hover{background:var(--color-paper-2);color:var(--color-ink)}
}
/* 手机和矮屏：比赛页撑满一屏，两张卡片 + VS + 按钮不用滚动就能看全 */
@media (max-width:40rem),(max-height:860px){
 #battle{height:100svh;padding-block:var(--space-md);display:flex;flex-direction:column}
 #battle>.container{flex:1;display:flex;flex-direction:column;min-height:0;width:100%}
 .meta h2{font-size:clamp(1.5rem,6vw,2rem)}
 .bar{height:12px}
 .arena{flex:1;min-height:0;margin-block:var(--space-md);gap:var(--space-xs)}
 .arena>.card{min-height:0;container-type:size}
 .row{margin-block:0}
 .card .t{flex:1;padding:var(--space-sm) var(--space-md);font-size:clamp(1rem,min(8.5cqw,11cqh),2.75rem)}
 .arena>.card{position:relative}
 .card .s{min-height:44px;padding:var(--space-xs) var(--space-2xl) var(--space-xs) var(--space-md);display:flex;align-items:center}
 /* 卡片较矮时，图标收进底部的票根行；卡片够高时再放大放在空白处 */
 .card .ic{position:absolute;right:var(--space-md);bottom:7px;padding:0;overflow:visible}
}

@media (max-width:40rem){.arena{grid-template-rows:1fr auto 1fr}}
@media (max-height:640px){#start{padding-block:var(--space-lg)}#start h1{font-size:clamp(3rem,min(12vw,18svh),11rem)}}
@media (max-width:40rem){.champ-ic{display:none}.arena{grid-template-columns:1fr}.vs{text-align:center}.rd div{flex-direction:column;gap:0}.rd div span{text-align:left}}
</style>
</head>
<body>
<main>
<section id="start" class="band-b">
 <div class="container">
  <h1>Sondheim Showdown.</h1>
  <p class="lead">12 Sondheim musicals, head to head, until one is left.</p>
  <div class="row start"><button class="btn primary" id="go"><kubai-icon class="ico" name="shuffle" size="20" trigger="parent"></kubai-icon>Start</button><button class="btn hide" id="resume"><kubai-icon class="ico" name="play" size="20" trigger="parent"></kubai-icon>Resume last game</button></div>
 </div>
</section>

<section id="battle" class="hide">
 <div class="container">
  <div class="meta"><h2 id="rname"></h2><p id="rprog"></p></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="arena" id="arena"></div>
  <div class="row"><button class="btn" id="undo"><kubai-icon class="ico" name="undo" size="20" trigger="parent"></kubai-icon>Undo last pick</button><button class="btn" id="quit"><kubai-icon class="ico" name="home" size="20" trigger="parent"></kubai-icon>Home</button></div>
 </div>
</section>

<section id="result" class="hide">
 <div class="band-b"><div class="container champ">
  <div class="champ-t"><h2 id="ct"></h2>
  <p class="lead" id="cs"></p>
  <p class="label">Your champion musical</p></div>
  <div class="champ-ic" id="cic" aria-hidden="true"></div>
 </div></div>
 <div class="container body">
  <div class="row"><button class="btn primary" id="dl"><kubai-icon class="ico" name="download" size="20" trigger="parent"></kubai-icon>Download image</button><button class="btn" id="cp"><kubai-icon class="ico" name="copy" size="20" trigger="parent"></kubai-icon>Copy share link</button><button class="btn" id="again"><kubai-icon class="ico" name="rotate-ccw" size="20" trigger="parent"></kubai-icon>Start over</button></div>
  <p class="msg" id="msg" role="status"></p>
  <details open><summary>Full bracket</summary><div id="recap"></div></details>
 </div>
</section>
</main>

<script>
// 剧目包：[英文名, 中文名(可留空), 首演年份, 图标名]。图标来自 Kubai Icons，可在 icons.kubai.design 查名字。想增减剧目，直接改这个列表即可；
// 新增剧目请追加在末尾，这样旧的分享链接不会失效。
const PACK=[
["A Funny Thing Happened on the Way to the Forum","",1962,"theater"],
["Anyone Can Whistle","",1964,"whistle"],
["Company","",1970,"cocktail"],
["Follies","",1971,"curtains"],
["A Little Night Music","",1973,"moon-star"],
["Pacific Overtures","",1976,"sun"],
["Sweeney Todd","",1979,"razor"],
["Merrily We Roll Along","",1981,"alarm-clock"],
["Sunday in the Park with George","",1984,"palette"],
["Into the Woods","",1987,"tree-pine"],
["Assassins","",1990,"target"],
["Passion","",1994,"heart"]
];
const $=id=>document.getElementById(id);
const KEY="sondheim-showdown-v2";
let order=[],picks=[];

const title=i=>PACK[i][1]||PACK[i][0];
const sub=i=>(PACK[i][1]?PACK[i][0]+", ":"")+PACK[i][2];
// 对阵表长度必须是 2 的幂，且编号都在剧目包范围内（防止旧存档或坏链接）
const valid=od=>Array.isArray(od)&&od.length>=2&&od.length<=64&&(od.length&(od.length-1))===0&&od.every(x=>Number.isInteger(x)&&x>=-1&&x<PACK.length);

function show(id){["start","battle","result"].forEach(x=>$(x).classList.toggle("hide",x!==id))}
function save(){try{localStorage.setItem(KEY,JSON.stringify({order,picks}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&valid(s.order)?s:null}catch(e){return null}}

// 开局洗牌一次(Fisher-Yates)，之后是固定对阵树；轮空(-1)补到2的幂，且轮空不会互相碰到
function makeOrder(ids){
 const a=ids.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 let P=2;while(P<a.length)P*=2;const half=P/2,two=a.length-half,out=[];let k=0;
 for(let i=0;i<half;i++){out.push(a[k++]);out.push(i<two?a[k++]:-1)}
 return out}

// 根据 order + picks 回放整个赛程
function sim(){let cur=order,pi=0;const R=[];
 while(cur.length>1){const ms=[],nx=[];let pend=false;
  for(let i=0;i<cur.length;i+=2){const a=cur[i],b=cur[i+1];let w=null,bye=false;
   if(a<0||b<0){w=a<0?b:a;bye=true}else if(!pend&&pi<picks.length){w=picks[pi++]?b:a}else pend=true;
   ms.push({a,b,w,bye});nx.push(w)}
  R.push(ms);if(pend)return{R,champ:null};cur=nx}
 return{R,champ:cur[0]}}

const COMPACT=matchMedia("(max-width:40rem),(max-height:860px)");
const rname=n=>n===2?"Final":n===4?"Semi-finals":n===8?"Quarter-finals":"Round of "+n;

function start(){order=makeOrder(PACK.map((_,i)=>i));picks=[];save();render()}

function render(){
 const {R,champ}=sim();
 if(champ!==null){show("result");return result(R,champ)}
 show("battle");
 const r=R[R.length-1],total=r.filter(m=>!m.bye).length,done=r.filter(m=>!m.bye&&m.w!==null).length;
 const m=r.find(m=>!m.bye&&m.w===null);
 $("rname").textContent=rname(r.length*2);$("rprog").textContent=done+" of "+total+" matches done";
 $("fill").style.transform="scaleX("+(done/total)+")";$("undo").disabled=!picks.length;
 const ar=$("arena");ar.innerHTML="";
 [m.a,m.b].forEach((id,side)=>{
  if(side===1){const v=document.createElement("div");v.className="vs";v.textContent="vs";ar.appendChild(v)}
  const c=document.createElement("button");c.className="card";
  c.innerHTML="<span class=\"t\"></span><span class=\"ic\"><kubai-icon name=\""+PACK[id][3]+"\" size=\""+(COMPACT.matches?30:112)+"\" trigger=\"parent\"></kubai-icon></span><span class=\"s\"></span>";c.firstChild.textContent=title(id);c.lastChild.textContent=sub(id);
  c.onclick=()=>{ar.querySelectorAll("button").forEach(x=>{x.disabled=true;x.classList.add(x===c?"won":"lost")});
   setTimeout(()=>{picks.push(side);save();render()},matchMedia("(prefers-reduced-motion:reduce)").matches?0:450)};
  ar.appendChild(c)})}

function result(R,champ){
 $("cic").innerHTML="<kubai-icon name=\""+PACK[champ][3]+"\" size=\"160\"></kubai-icon>";$("ct").textContent=title(champ);$("cs").textContent=sub(champ);$("msg").textContent="";
 const box=$("recap");box.innerHTML="";
 for(let i=R.length-1;i>=0;i--){const d=document.createElement("div");d.className="rd";
  d.innerHTML="<h3></h3>";d.firstChild.textContent=rname(R[i].length*2);
  R[i].forEach(m=>{const l=document.createElement("div");
   if(m.bye){l.innerHTML="<b></b><span>Bye</span>";l.firstChild.textContent=title(m.w)}
   else{const w=m.w,o=w===m.a?m.b:m.a;l.innerHTML="<b></b><span></span>";l.firstChild.textContent=title(w);l.lastChild.textContent="beat "+title(o)}
   d.appendChild(l)});box.appendChild(d)}}

// 分享链接：剧目顺序 + 每场选了左(0)还是右(1)，无需压缩库
// 正式网址；在 Claude 预览等沙盒里读不到真实网址，就回退到这个地址
const SITE="https://giantpuppy.github.io/sondheim-showdown/";
const base=()=>/^https?:$/.test(location.protocol)&&!/claudeusercontent|claude\.ai/.test(location.hostname)?location.origin+location.pathname:SITE;
const link=()=>base()+"#v1|"+order.join(",")+"|"+picks.join("");
function fromHash(){const h=location.hash;if(!h.startsWith("#v1|"))return false;
 try{const [,o,p]=h.split("|");const od=o.split(",").map(Number),pk=(p||"").split("").map(Number);
  if(!valid(od)||pk.some(x=>x!==0&&x!==1))return false;order=od;picks=pk;return true}catch(e){return false}}

$("dl").onclick=()=>{
 const {R,champ}=sim(),c=document.createElement("canvas");c.width=1080;c.height=1920;const x=c.getContext("2d");
 // 颜色和字体都从页面的 CSS 变量里读，保持和网页一致
 const v=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
 const paper=v("--color-paper"),ink=v("--color-ink"),acc=v("--color-accent"),acc2=v("--color-accent-2"),disp=v("--font-display"),body=v("--font-body");
 x.fillStyle=paper;x.fillRect(0,0,1080,1920);
 x.fillStyle=acc2;x.fillRect(0,0,1080,500);
 x.fillStyle=paper;x.textAlign="left";
 x.font="800 190px "+disp;x.fillText("SONDHEIM",90,260);x.fillText("SHOWDOWN.",90,450);
 // 冠军票：硬阴影 + 墨色描边
 const bx=90,by=600,bw=900,bh=620;
 x.fillStyle=ink;x.fillRect(bx+18,by+18,bw,bh);
 x.fillStyle=acc;x.fillRect(bx,by,bw,bh);
 x.strokeStyle=ink;x.lineWidth=8;x.strokeRect(bx,by,bw,bh);
 x.fillStyle=ink;x.font="500 40px "+body;x.fillText("My champion musical",bx+50,by+90);
 // 冠军名过长时自动缩小字号并换行（英文按单词，中文按字）
 const raw=title(champ),cjk=/[\u4e00-\u9fff]/.test(raw),name=cjk?raw:raw.toUpperCase(),words=cjk?name.split(""):name.split(" "),glue=cjk?"":" ";
 let fs=200,lines;
 const wrap=()=>{x.font="800 "+fs+"px "+disp;lines=[];let l="";
  words.forEach(w=>{const t=l?l+glue+w:w;if(x.measureText(t).width>bw-100&&l){lines.push(l);l=w}else l=t});lines.push(l)};
 wrap();while(lines.length>3&&fs>70){fs-=10;wrap()}
 x.fillStyle=ink;lines.forEach((l,i)=>x.fillText(l,bx+50,by+120+fs*0.95*(i+1)));
 x.font="500 40px "+body;x.fillText(sub(champ),bx+50,by+bh-50);
 // 简要赛程
 let y=1350;x.font="500 38px "+body;
 for(let i=R.length-1;i>=Math.max(0,R.length-4);i--){const m=R[i].find(m=>!m.bye&&(m.a===champ||m.b===champ));
  if(!m)continue;const o=m.a===champ?m.b:m.a;let t=rname(R[i].length*2)+": beat "+title(o);
  while(x.measureText(t).width>900)t=t.slice(0,-2);x.fillText(t,90,y);y+=62}
 x.fillStyle=acc2;x.fillRect(90,1740,900,8);
 x.fillStyle=ink;x.font="500 32px "+body;x.fillText(base().replace(/^https?:\/\//,""),90,1810);
 c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="sondheim-champion.png";a.click();$("msg").textContent="Image saved"})};
$("cp").onclick=async()=>{const u=link();let ok=false;
 try{await navigator.clipboard.writeText(u);ok=true}catch(e){
  // 备用方案：沙盒/旧浏览器里 clipboard API 可能被禁用
  try{const t=document.createElement("textarea");t.value=u;t.style.cssText="position:fixed;opacity:0";document.body.appendChild(t);t.select();ok=document.execCommand("copy");t.remove()}catch(e2){}}
 $("msg").textContent=ok?"Link copied":"Couldn't copy. Try another browser."};
$("again").onclick=()=>{try{history.replaceState(null,"",location.pathname)}catch(e){}show("start")};
$("quit").onclick=()=>show("start");
// 屏幕尺寸/横竖屏变化时重绘比赛页，让图标尺寸跟着布局走
COMPACT.addEventListener("change",()=>{if(!$("battle").classList.contains("hide"))render()});
$("undo").onclick=()=>{picks.pop();save();render()};
$("go").onclick=start;
$("resume").onclick=()=>{const s=load();if(!s)return;order=s.order;picks=s.picks;render()};

if(fromHash()){render()}
else if(load())$("resume").classList.remove("hide");
</script>
</body>
</html>
